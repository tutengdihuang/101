# Trade Service Deployment - GitOps 配置
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-service
  namespace: service-test
  labels:
    app: trade-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-service
  template:
    metadata:
      labels:
        app: trade-service
    spec:
      containers:
      - name: trade-service
        image: 182.42.82.135:30002/service-test/trade-service:v1
        ports:
        - containerPort: 9003
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 9003
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9003
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: trade-service
  namespace: service-test
spec:
  ports:
  - port: 9003
    targetPort: 9003
  selector:
    app: trade-service
