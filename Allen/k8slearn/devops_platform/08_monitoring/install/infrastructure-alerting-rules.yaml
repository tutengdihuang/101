apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infrastructure-alerting-rules
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: node.rules
      rules:
        - alert: NodeHighCPUUsage
          expr: |
            100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 5m
          labels:
            severity: warning
            component: node
          annotations:
            summary: "节点 CPU 使用率过高"
            description: "节点 {{ $labels.instance }} CPU 使用率超过 80%，当前值: {{ $value | printf \"%.1f\" }}%"
        
        - alert: NodeCriticalCPUUsage
          expr: |
            100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
          for: 5m
          labels:
            severity: critical
            component: node
          annotations:
            summary: "节点 CPU 使用率严重过高"
            description: "节点 {{ $labels.instance }} CPU 使用率超过 95%，当前值: {{ $value | printf \"%.1f\" }}%"
        
        - alert: NodeHighMemoryUsage
          expr: |
            (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
          for: 5m
          labels:
            severity: warning
            component: node
          annotations:
            summary: "节点内存使用率过高"
            description: "节点 {{ $labels.instance }} 内存使用率超过 85%，当前值: {{ $value | printf \"%.1f\" }}%"
        
        - alert: NodeHighDiskUsage
          expr: |
            (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 80
          for: 5m
          labels:
            severity: warning
            component: node
          annotations:
            summary: "节点磁盘使用率过高"
            description: "节点 {{ $labels.instance }} 磁盘 {{ $labels.mountpoint }} 使用率超过 80%，当前值: {{ $value | printf \"%.1f\" }}%"
        
        - alert: NodeCriticalDiskUsage
          expr: |
            (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 90
          for: 5m
          labels:
            severity: critical
            component: node
          annotations:
            summary: "节点磁盘使用率严重过高"
            description: "节点 {{ $labels.instance }} 磁盘 {{ $labels.mountpoint }} 使用率超过 90%，当前值: {{ $value | printf \"%.1f\" }}%"
    
    - name: pod.rules
      rules:
        - alert: PodCrashLoopBackOff
          expr: |
            kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
          for: 5m
          labels:
            severity: critical
            component: pod
          annotations:
            summary: "Pod 处于 CrashLoopBackOff 状态"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 容器 {{ $labels.container }} 处于 CrashLoopBackOff 状态"
        
        - alert: PodFrequentRestart
          expr: |
            increase(kube_pod_container_status_restarts_total[10m]) > 5
          for: 1m
          labels:
            severity: warning
            component: pod
          annotations:
            summary: "Pod 频繁重启"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 在 10 分钟内重启超过 5 次"
        
        - alert: PodPendingTooLong
          expr: |
            kube_pod_status_phase{phase="Pending"} == 1
          for: 15m
          labels:
            severity: warning
            component: pod
          annotations:
            summary: "Pod 长时间处于 Pending 状态"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 已 Pending 超过 15 分钟"
        
        - alert: PodOOMKilled
          expr: |
            kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
          for: 1m
          labels:
            severity: critical
            component: pod
          annotations:
            summary: "Pod 因 OOM 被终止"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 容器 {{ $labels.container }} 因内存不足被终止"
