apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cicd-alerting-rules
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: tekton.rules
      rules:
        - alert: TektonPipelineRunFailed
          expr: |
            increase(tekton_pipelines_controller_pipelinerun_count{status="failed"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
            component: tekton
          annotations:
            summary: "Tekton PipelineRun 失败"
            description: "命名空间 {{ $labels.namespace }} 中有 PipelineRun 执行失败"
        
        - alert: TektonPipelineRunTooLong
          expr: |
            tekton_pipelines_controller_running_pipelineruns_count > 0
          for: 30m
          labels:
            severity: warning
            component: tekton
          annotations:
            summary: "Tekton PipelineRun 执行时间过长"
            description: "有 PipelineRun 执行时间超过 30 分钟"
        
        - alert: TektonTooManyRunningPipelines
          expr: |
            tekton_pipelines_controller_running_pipelineruns_count > 10
          for: 5m
          labels:
            severity: warning
            component: tekton
          annotations:
            summary: "Tekton 并发 PipelineRun 过多"
            description: "当前有 {{ $value }} 个 PipelineRun 正在运行，可能存在资源竞争"
    
    - name: argocd.rules
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: |
            argocd_app_info{sync_status!="Synced"} == 1
          for: 10m
          labels:
            severity: warning
            component: argocd
          annotations:
            summary: "ArgoCD Application 未同步"
            description: "应用 {{ $labels.name }} 在命名空间 {{ $labels.namespace }} 中已超过 10 分钟未同步"
        
        - alert: ArgoCDAppDegraded
          expr: |
            argocd_app_info{health_status="Degraded"} == 1
          for: 5m
          labels:
            severity: critical
            component: argocd
          annotations:
            summary: "ArgoCD Application 健康状态异常"
            description: "应用 {{ $labels.name }} 健康状态为 Degraded"
        
        - alert: ArgoCDAppMissing
          expr: |
            argocd_app_info{health_status="Missing"} == 1
          for: 5m
          labels:
            severity: critical
            component: argocd
          annotations:
            summary: "ArgoCD Application 资源缺失"
            description: "应用 {{ $labels.name }} 有资源缺失"
        
        - alert: ArgoCDSyncFailed
          expr: |
            increase(argocd_app_sync_total{phase="Failed"}[10m]) > 0
          for: 1m
          labels:
            severity: critical
            component: argocd
          annotations:
            summary: "ArgoCD 同步失败"
            description: "应用 {{ $labels.name }} 同步失败"
