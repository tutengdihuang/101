# kube-prometheus-stack Helm Values
# 轻量化配置 + 使用可访问的镜像源

# ============================================
# Prometheus Operator 配置
# ============================================
prometheusOperator:
  enabled: true
  
  # 使用 quay.io 镜像
  image:
    registry: swr.cn-north-4.myhuaweicloud.com
    repository: ddn-k8s/quay.io/prometheus-operator/prometheus-operator
    tag: v0.82.2
  
  # 禁用 admission webhook（避免镜像拉取问题）
  admissionWebhooks:
    enabled: false
  
  # 禁用 TLS
  tls:
    enabled: false
  
  # prometheusConfigReloader 镜像
  prometheusConfigReloader:
    image:
      registry: swr.cn-north-4.myhuaweicloud.com
      repository: ddn-k8s/quay.io/prometheus-operator/prometheus-config-reloader
      tag: v0.82.2
  
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# ============================================
# Grafana 配置
# ============================================
grafana:
  enabled: true
  adminPassword: "admin123"
  
  # Docker Hub 镜像
  image:
    registry: swr.cn-north-4.myhuaweicloud.com
    repository: ddn-k8s/docker.io/grafana/grafana
    tag: "10.4.2"
  
  service:
    type: NodePort
    nodePort: 30300
  
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 300m
  
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: "Asia/Shanghai"
  
  sidecar:
    image:
      registry: swr.cn-north-4.myhuaweicloud.com
      repository: ddn-k8s/quay.io/kiwigrid/k8s-sidecar
      tag: 1.30.3
    dashboards:
      enabled: true
    datasources:
      enabled: true

# ============================================
# Prometheus 配置
# ============================================
prometheus:
  enabled: true
  
  service:
    type: NodePort
    nodePort: 30909
  
  prometheusSpec:
    # quay.io 镜像
    image:
      registry: swr.cn-north-4.myhuaweicloud.com
      repository: ddn-k8s/quay.io/prometheus/prometheus
      tag: v3.2.1
    
    retention: 7d
    
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: 500m
    
    storageSpec: {}
    
    scrapeInterval: 30s
    evaluationInterval: 30s
    
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

# ============================================
# AlertManager 配置
# ============================================
alertmanager:
  enabled: true
  
  service:
    type: NodePort
    nodePort: 30903
  
  alertmanagerSpec:
    image:
      registry: swr.cn-north-4.myhuaweicloud.com
      repository: ddn-k8s/quay.io/prometheus/alertmanager
      tag: v0.27.0
    
    retention: 120h
    
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 100m
    
    storage: {}
  
  config:
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-receiver'
      routes:
        - match:
            severity: critical
          receiver: 'critical-receiver'
          group_wait: 10s
          repeat_interval: 1h
        - match:
            severity: warning
          receiver: 'warning-receiver'
          repeat_interval: 4h
        - match_re:
            alertname: ^(Tekton|ArgoCD).*
          receiver: 'cicd-receiver'
          group_by: ['alertname', 'namespace']
    
    receivers:
      - name: 'default-receiver'
        webhook_configs:
          - url: 'http://localhost:5001/webhook'
            send_resolved: true
      - name: 'critical-receiver'
        webhook_configs:
          - url: 'http://localhost:5001/webhook/critical'
            send_resolved: true
      - name: 'warning-receiver'
        webhook_configs:
          - url: 'http://localhost:5001/webhook/warning'
            send_resolved: true
      - name: 'cicd-receiver'
        webhook_configs:
          - url: 'http://localhost:5001/webhook/cicd'
            send_resolved: true
    
    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'namespace', 'instance']

# ============================================
# Node Exporter 配置
# ============================================
nodeExporter:
  enabled: true

prometheus-node-exporter:
  image:
    registry: quay.io
    repository: prometheus/node-exporter
    tag: v1.9.0
  
  resources:
    requests:
      memory: 50Mi
      cpu: 50m
    limits:
      memory: 100Mi
      cpu: 100m

# ============================================
# kube-state-metrics 配置
# ============================================
kubeStateMetrics:
  enabled: true

kube-state-metrics:
  # 使用华为云镜像
  image:
    registry: swr.cn-north-4.myhuaweicloud.com
    repository: ddn-k8s/registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.15.0
  
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 100m

# ============================================
# 其他组件
# ============================================
kubeApiServer:
  enabled: true

kubelet:
  enabled: true

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: true

kubeEtcd:
  enabled: false

# ============================================
# 默认告警规则（精简版）
# ============================================
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: false
    general: true
    k8s: true
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubelet: true
    kubeProxy: false
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: false
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: false

# ============================================
# Thanos（禁用）
# ============================================
thanosRuler:
  enabled: false
