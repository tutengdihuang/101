# TriggerTemplate - 定义触发时创建的 PipelineRun
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: service-test-trigger-template
  namespace: tekton-pipelines
spec:
  params:
  - name: git-revision
    description: The git revision
    default: main
  - name: git-repo-url
    description: The git repository url
    default: https://gitee.com/bitcash/service_test.git
  resourcetemplates:
  - apiVersion: tekton.dev/v1
    kind: PipelineRun
    metadata:
      generateName: service-test-auto-
    spec:
      pipelineRef:
        name: service-test-simple-v2
      params:
      - name: git-url
        value: $(tt.params.git-repo-url)
      - name: git-revision
        value: $(tt.params.git-revision)
      - name: image-registry
        value: 182.42.82.135:30002/service-test
      - name: image-tag
        value: v1
      workspaces:
      - name: shared-workspace
        emptyDir: {}
      taskRunTemplate:
        serviceAccountName: tekton-build-sa
      timeouts:
        pipeline: 3h
        tasks: 2h
