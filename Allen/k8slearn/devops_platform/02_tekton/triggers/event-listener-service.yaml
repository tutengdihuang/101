# NodePort Service for EventListener - 暴露给外部 Webhook 访问
apiVersion: v1
kind: Service
metadata:
  name: el-gitee-listener-external
  namespace: tekton-pipelines
spec:
  type: NodePort
  selector:
    eventlistener: gitee-listener
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
    nodePort: 30880
