# Build Service Task - Clone + Build + Push 一体化
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-service
  namespace: tekton-pipelines
spec:
  description: Clone, build and push a service image
  params:
  - name: git-url
    type: string
    description: Git repository URL
  - name: git-revision
    type: string
    default: main
  - name: image
    type: string
    description: Full image name with registry
  - name: dockerfile
    type: string
    description: Path to Dockerfile
  - name: tag
    type: string
    default: latest
  - name: registry
    type: string
    default: "182.42.82.135:30002"
  - name: registry-user
    type: string
    default: "admin"
  - name: registry-password
    type: string
    default: "Harbor12345"
  steps:
  - name: clone
    image: docker.m.daocloud.io/alpine/git:latest
    script: |
      #!/bin/sh
      set -ex
      cd /workspace
      git clone $(params.git-url) source
      cd source
      git checkout $(params.git-revision)
      echo "Cloned at $(git rev-parse HEAD)"
  - name: build-and-push
    image: 182.42.82.135:30002/service-test/kaniko:latest
    script: |
      #!/busybox/sh
      set -ex
      # 创建 docker config
      mkdir -p /kaniko/.docker
      AUTH=$(echo -n "$(params.registry-user):$(params.registry-password)" | base64)
      cat > /kaniko/.docker/config.json << EOF
      {
        "auths": {
          "$(params.registry)": {
            "auth": "$AUTH"
          }
        }
      }
      EOF
      # 执行构建
      /kaniko/executor \
        --dockerfile=/workspace/source/$(params.dockerfile) \
        --context=/workspace/source \
        --destination=$(params.image):$(params.tag) \
        --insecure \
        --skip-tls-verify \
        --cache=false
