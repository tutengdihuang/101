# Harbor Registry Secret for Tekton
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry-secret
  namespace: tekton-pipelines
  annotations:
    tekton.dev/docker-0: http://182.42.82.135:30002
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "182.42.82.135:30002": {
          "username": "admin",
          "password": "Harbor12345",
          "auth": "YWRtaW46SGFyYm9yMTIzNDU="
        }
      }
    }
---
# ServiceAccount for Pipeline
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-build-sa
  namespace: tekton-pipelines
secrets:
- name: harbor-registry-secret
imagePullSecrets:
- name: harbor-registry-secret
