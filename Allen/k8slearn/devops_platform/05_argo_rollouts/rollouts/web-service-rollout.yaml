# Web Service - 金丝雀发布配置
# 替换原有的 Deployment，实现渐进式发布
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: web-service
  namespace: service-test
  labels:
    app: web-service
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: web-service
  strategy:
    canary:
      # 金丝雀发布步骤
      steps:
      - setWeight: 10          # 第1步：10% 流量到新版本
      - pause: {duration: 2m}  # 暂停 2 分钟观察
      - setWeight: 30          # 第2步：30% 流量
      - pause: {duration: 2m}  # 暂停 2 分钟
      - setWeight: 50          # 第3步：50% 流量
      - pause: {duration: 2m}  # 暂停 2 分钟
      - setWeight: 100         # 第4步：全量发布
      
      # 金丝雀服务（可选，用于精确流量控制）
      # canaryService: web-service-canary
      # stableService: web-service
  template:
    metadata:
      labels:
        app: web-service
    spec:
      containers:
      - name: web
        image: 182.42.82.135:30002/service-test/web-service:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 8888
          name: http
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /app/etc
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8888
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: web-service-config
---
# Service 保持不变
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: service-test
  labels:
    app: web-service
spec:
  type: NodePort
  ports:
  - port: 8888
    targetPort: 8888
    protocol: TCP
    name: http
    nodePort: 30888
  selector:
    app: web-service
---
# Ingress 保持不变
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-ingress
  namespace: service-test
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: service-test.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 8888
