# User Service - 金丝雀发布配置
# 替换原有的 Deployment，实现渐进式发布
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: user-service
  namespace: service-test
  labels:
    app: user-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: user-service
  strategy:
    canary:
      # 金丝雀发布步骤
      steps:
      - setWeight: 10          # 第1步：10% 流量到新版本
      - pause: {duration: 2m}  # 暂停 2 分钟观察
      - setWeight: 30          # 第2步：30% 流量
      - pause: {duration: 2m}  # 暂停 2 分钟
      - setWeight: 50          # 第3步：50% 流量
      - pause: {duration: 2m}  # 暂停 2 分钟
      - setWeight: 100         # 第4步：全量发布
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user
        image: 182.42.82.135:30002/service-test/user-service:v1
        imagePullPolicy: Always
        ports:
        - containerPort: 9001
          name: grpc
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /app/etc
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: user-service-config
---
# Service 保持不变
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: service-test
  labels:
    app: user-service
spec:
  type: ClusterIP
  ports:
  - port: 9001
    targetPort: 9001
    protocol: TCP
    name: grpc
  selector:
    app: user-service
