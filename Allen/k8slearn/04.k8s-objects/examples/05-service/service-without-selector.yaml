# 无 Selector 的 Service + 手动 Endpoints
# 用于访问集群外部的 IP 地址
apiVersion: v1
kind: Service
metadata:
  name: external-service
spec:
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-service    # 必须和 Service 同名
subsets:
- addresses:
  - ip: 192.168.1.100       # 外部服务器 IP
  - ip: 192.168.1.101
  ports:
  - port: 80
