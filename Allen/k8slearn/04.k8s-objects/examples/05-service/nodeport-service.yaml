# NodePort Service 示例
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  labels:
    app: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - name: http
    port: 80               # Service 端口（集群内访问）
    targetPort: 80         # Pod 端口
    nodePort: 30080        # 节点端口（30000-32767）
    protocol: TCP
