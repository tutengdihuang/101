# Pod 使用 Secret 示例
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo-pod
spec:
  containers:
  - name: demo
    image: busybox
    command: ['sh', '-c', 'echo "DB User: $DB_USER" && echo "DB Pass: $DB_PASS" && sleep 3600']
    
    # 方式1：环境变量引用
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-credentials-plain
          key: username
    - name: DB_PASS
      valueFrom:
        secretKeyRef:
          name: db-credentials-plain
          key: password
    
    # 方式2：挂载为文件
    volumeMounts:
    - name: secret-volume
      mountPath: /etc/secrets
      readOnly: true
  
  volumes:
  - name: secret-volume
    secret:
      secretName: db-credentials-plain
