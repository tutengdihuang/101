# Gateway
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: simple
spec:
  selector:
    istio: ingressgateway
  servers:
  - hosts:
    - simple.cncamp.io
    port:
      name: http-simple
      number: 80
      protocol: HTTP
---
# VirtualService - 七层路由规则
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: simple
spec:
  gateways:
  - simple
  hosts:
  - simple.cncamp.io
  http:
  # 规则1：精确匹配 /simple/hello，重写为 /hello，路由到 simple 服务
  - match:
    - uri:
        exact: "/simple/hello"
    rewrite:
      uri: "/hello"
    route:
    - destination:
        host: simple.simple.svc.cluster.local
        port:
          number: 80
  # 规则2：前缀匹配 /nginx，重写为 /，路由到 nginx 服务
  - match:
    - uri:
        prefix: "/nginx"
    rewrite:
      uri: "/"
    route:
    - destination:
        host: nginx.simple.svc.cluster.local
        port:
          number: 80
