# 超时配置
# 如果上游服务响应超过 1s，返回超时错误
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: canary
spec:
  hosts:
  - canary
  http:
  - match:
    - headers:
        user:
          exact: jesse
    route:
    - destination:
        host: canary
        subset: v2
    timeout: 1s    # 超时时间 1 秒
  - route:
    - destination:
        host: canary
        subset: v1
