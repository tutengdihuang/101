# Init Container 示例
apiVersion: v1
kind: Pod
metadata:
  name: init-container-pod
  labels:
    app: init-demo
spec:
  initContainers:
  # 初始化容器：等待依赖服务就绪
  - name: wait-for-service
    image: busybox
    command: ['sh', '-c', 'echo "Waiting for service..." && sleep 5 && echo "Service ready!"']
  
  # 初始化容器：准备配置文件
  - name: prepare-config
    image: busybox
    command: ['sh', '-c', 'echo "Hello from init container" > /work-dir/index.html']
    volumeMounts:
    - name: workdir
      mountPath: /work-dir
  
  containers:
  - name: nginx
    image: nginx:1.21
    ports:
    - containerPort: 80
    volumeMounts:
    - name: workdir
      mountPath: /usr/share/nginx/html
  
  volumes:
  - name: workdir
    emptyDir: {}
