# Pod 使用 ConfigMap 示例
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo-pod
spec:
  containers:
  - name: demo
    image: nginx:1.21
    
    # 方式1：单个环境变量引用
    env:
    - name: DATABASE_HOST
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: database_host
    - name: DATABASE_PORT
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: database_port
    
    # 方式2：挂载为文件
    volumeMounts:
    - name: config-volume
      mountPath: /etc/nginx/nginx.conf
      subPath: nginx.conf
    - name: app-config-volume
      mountPath: /etc/app
  
  volumes:
  - name: config-volume
    configMap:
      name: nginx-config
  - name: app-config-volume
    configMap:
      name: app-config
