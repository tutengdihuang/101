# ConfigMap 示例 - 键值对配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # 简单键值对
  database_host: "mysql.default.svc.cluster.local"
  database_port: "3306"
  log_level: "INFO"
  
  # 多行配置文件
  app.properties: |
    server.port=8080
    spring.profiles.active=production
    logging.level.root=INFO
