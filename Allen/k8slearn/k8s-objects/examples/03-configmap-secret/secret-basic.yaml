# Secret 示例 - 数据库凭证
# 注意：data 中的值需要 base64 编码
# echo -n 'admin' | base64 → YWRtaW4=
# echo -n 'S3cr3tP@ssw0rd' | base64 → UzNjcjN0UEBzc3cwcmQ=
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
data:
  username: YWRtaW4=              # admin
  password: UzNjcjN0UEBzc3cwcmQ=  # S3cr3tP@ssw0rd
---
# 使用 stringData 可以直接写明文（K8s 会自动编码）
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-plain
type: Opaque
stringData:
  username: admin
  password: S3cr3tP@ssw0rd
