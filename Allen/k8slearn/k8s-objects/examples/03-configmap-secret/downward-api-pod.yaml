# Downward API 示例 - 获取 Pod 元数据
apiVersion: v1
kind: Pod
metadata:
  name: downward-api-pod
  labels:
    app: demo
    version: v1
  annotations:
    description: "Downward API demo pod"
spec:
  containers:
  - name: demo
    image: busybox
    command: ['sh', '-c', 'env && sleep 3600']
    
    # 通过环境变量获取 Pod 信息
    env:
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: POD_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: POD_SERVICE_ACCOUNT
      valueFrom:
        fieldRef:
          fieldPath: spec.serviceAccountName
    
    # 获取资源限制
    - name: CPU_REQUEST
      valueFrom:
        resourceFieldRef:
          containerName: demo
          resource: requests.cpu
    - name: MEMORY_LIMIT
      valueFrom:
        resourceFieldRef:
          containerName: demo
          resource: limits.memory
    
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    
    # 通过 Volume 获取 Labels 和 Annotations
    volumeMounts:
    - name: podinfo
      mountPath: /etc/podinfo
  
  volumes:
  - name: podinfo
    downwardAPI:
      items:
      - path: "labels"
        fieldRef:
          fieldPath: metadata.labels
      - path: "annotations"
        fieldRef:
          fieldPath: metadata.annotations
