# Operator 镜像配置
image:
  repository: crpi-j9gshcbjtb1i6c7h.cn-hangzhou.personal.cr.aliyuncs.com/tutengdihuang/k8s-test-operator
  tag: latest
  pullPolicy: Always

# 镜像拉取密钥
imagePullSecrets: []
# - name: aliyun-cr

# Operator 副本数
replicaCount: 1

# 资源限制
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# 是否安装 CRD
installCRD: true

# 是否创建示例 CR
createExampleCR: false

# 示例 CR 配置
k8stest:
  name: k8stest-sample
  namespace: service-test
  spec:
    namespace: service-test
    imageRegistry: crpi-j9gshcbjtb1i6c7h.cn-hangzhou.personal.cr.aliyuncs.com/tutengdihuang
    imageTag: latest
    replicas: 2
    pullSecret: ""

# Operator 部署命名空间
operatorNamespace: k8s-test-operator-system

# 健康检查配置
healthProbeBindAddress: :8081
metricsBindAddress: :8080

# Leader 选举
leaderElection:
  enabled: true

# ServiceAccount 配置
serviceAccount:
  create: true
  name: ""
