{{- if .Values.installCRD }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tenants.tenant.cncamp.io
  labels:
    {{- include "tenant-operator.labels" . | nindent 4 }}
spec:
  group: tenant.cncamp.io
  scope: Cluster
  names:
    plural: tenants
    singular: tenant
    kind: Tenant
    shortNames:
    - ten
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              namespace:
                type: string
              adminUser:
                type: string
              objectCounts:
                type: object
                properties:
                  configMaps:
                    type: string
                  secrets:
                    type: string
                  services:
                    type: string
                  loadBalancers:
                    type: string
                  nodePorts:
                    type: string
              podQuota:
                type: object
                properties:
                  pods:
                    type: string
          status:
            type: object
            properties:
              phase:
                type: string
              observedGeneration:
                type: integer
                format: int64
              lastAppliedNamespace:
                type: string
{{- end }}
